type: command
when: '! grep -qsxE "done|stopped" status-*.txt'  # a round after the manager finished or stopped the loop runs nothing
requires:
  - table_pattern: write-worker-9
command: |
  bash .memdoor/workflows/gvs5h/check-samples.sh > test-output-9.log 2>&1; st=$?
  if [ "$st" -eq 0 ]; then
      echo "[SAMPLE TESTS: PASSED all samples -- the solution looks correct.] " > samples-9.txt
  else
      echo "[SAMPLE TESTS: FAILED -- the current solution is WRONG (exit $st). Fix the bug or, if this approach keeps failing, switch to a DIFFERENT approach.] " > samples-9.txt
  fi
  cat test-output-9.log samples-9.txt
timeout: 5m
max_retries: 0
