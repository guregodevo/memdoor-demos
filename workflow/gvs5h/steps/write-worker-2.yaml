type: command
when: '! grep -qsxE "done|stopped" status-*.txt'  # a round after the manager finished or stopped the loop runs nothing
requires:
  - table_pattern: worker-2
command: |
  cat > worker-reply-2.raw <<'MEMDOOR_WRK_EOF'
  {{ output "worker-2" }}
  MEMDOOR_WRK_EOF
  if grep -qsxE "done|stopped" status-*.txt 2>/dev/null; then echo "a manager already said done or stopped the loop: the ledger is kept as it is"; exit 0; fi
  awk '/^```python/{f=1;next} /^```[ ]*$/{if(f)exit} f' worker-reply-2.raw > solution.py
  awk '/^### NOTES/{f=1;next} /^### /{f=0} f' worker-reply-2.raw > notes.md
  awk '/^### NEXT/{f=1;next} /^### /{f=0} f' worker-reply-2.raw > nexts-2.txt
  sed -n '/^### STATUS/,$p' worker-reply-2.raw | tail -n +2 > wstatus-2.txt
  head -40 worker-reply-2.raw
