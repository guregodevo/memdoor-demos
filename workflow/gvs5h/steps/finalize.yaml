type: llm
when: '! grep -qsx done status-*.txt'  # the paper finalizes unless the manager said done; a stopped loop still finalizes
model: openrouter:qwen/qwen3.8-27b thinking high order modal,coreweave,parasail,wafer max_tokens 128000
requires:
  - table_pattern: read-task
  - table_pattern: write-plan
  - table_pattern: write-worker-10
  - table_pattern: write-manage-10
  - table_pattern: samples-10
prompt: |
  You are a WORKER subagent, an expert competitive programmer. This is the FINAL round
  of the loop. Decide: if the manager's latest STATUS below is 'done' AND the latest
  SAMPLE VERDICT below says the samples PASSED, the current solution is already
  definitive -- reply with it copied EXACTLY, unchanged. Otherwise produce the
  DEFINITIVE final solution now, using all notes and current work: build on the current
  solution where it helps, or write a fresh one for the most promising approach in the
  notes if the current one is stuck or wrong.

  THE FORMAT IS MANDATORY AND YOUR REPLY IS PARSED BY A PROGRAM. Begin your reply with
  the literal line '### CODE', then a fenced ```python block. Write nothing before the
  header and nothing after the closing fence. A reply without these is discarded.

  ### CODE
  ```python
  <the FULL self-contained program>
  ```

  PROBLEM:
  {{ output "read-task" }}

  PLAN:
  {{ output "write-plan" }}

  MANAGER STATUS AND TASK LIST:
  {{ output "write-manage-10" }}

  SAMPLE VERDICT:
  {{ output "samples-10" }}

  NOTES AND CURRENT SOLUTION:
  {{ output "write-worker-10" }}
timeout: 15m
max_retries: 1
