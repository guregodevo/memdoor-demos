type: command
when: '! grep -qsxE "done|stopped" status-*.txt'  # a round after the manager finished or stopped the loop runs nothing
requires:
  - table_pattern: digest-4
command: |
  cat > digest-4.md <<'MEMDOOR_DIG_EOF'
  {{ output "digest-4" }}
  MEMDOOR_DIG_EOF
  cat digest-4.md
timeout: 2m
max_retries: 0
