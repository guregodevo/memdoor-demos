type: command
when: grep -qs "PASSED" samples-6.txt && ! grep -qsxE "done|stopped" status-*.txt  # only after the public samples passed, and only while the loop is live
requires:
  - table_pattern: samples-6
  - table_pattern: write-brute
  - table_pattern: write-gen
command: |
  rm -f stress-6.txt stress-in-6.txt s-out-6.txt b-out-6.txt s-err-6.txt b-err-6.txt
  verdict=ok
  for i in $(seq 1 200); do
      if ! python3 gen.py > stress-in-6.txt 2>/dev/null; then
          verdict=genfail; break
      fi
      perl -e 'alarm shift; exec @ARGV or exit 127' 2 bash .memdoor/workflows/gvs5h/run.sh solution.py < stress-in-6.txt > s-out-6.txt 2> s-err-6.txt; s=$?
      perl -e 'alarm shift; exec @ARGV or exit 127' 2 bash .memdoor/workflows/gvs5h/run.sh brute.py < stress-in-6.txt > b-out-6.txt 2> b-err-6.txt; b=$?
      if [ "$s" -ne 0 ]; then
          verdict=crash; break
      fi
      if [ "$b" -ne 0 ]; then
          verdict=brutefail; break
      fi
      if ! python3 -c 'import sys; a, b = (open(f).read().split() for f in sys.argv[1:]); sys.exit(a != b)' s-out-6.txt b-out-6.txt; then  # token by token, as the grader compares
          verdict=mismatch; break
      fi
  done
  case "$verdict" in
      ok)
          { echo "[STRESS: ok -- solution.py matched brute.py on 200 small random inputs.]"; } > stress-6.txt
          ;;
      genfail)
          { echo "[STRESS: FAILED -- gen.py exited unsuccessfully or produced invalid input on iteration $i.]"; cat stress-in-6.txt 2>/dev/null; } > stress-6.txt
          ;;
      crash)
          { echo "[STRESS: FAILED -- solution.py timed out (2 s) or crashed on iteration $i. THIS IS A FAILING TEST. INPUT:]"; cat stress-in-6.txt; echo "--- solution.py stdout:"; cat s-out-6.txt; echo "--- solution.py stderr:"; tail -5 s-err-6.txt; } > stress-6.txt
          ;;
      brutefail)
          { echo "[STRESS: INCONCLUSIVE -- brute.py, the reference, crashed or timed out (2 s) on iteration $i; this says nothing about solution.py. The worker must REWRITE brute.py (section ### BRUTE): the slowest obviously correct method, small inputs only, same input contract. INPUT:]"; cat stress-in-6.txt; echo "--- brute.py stderr:"; tail -5 b-err-6.txt; } > stress-6.txt
          ;;
      mismatch)
          { echo "[STRESS: FAILED -- outputs differ on iteration $i. THIS IS A FAILING TEST; fix the bug it exposes. INPUT:]"; cat stress-in-6.txt; echo "--- solution.py output:"; cat s-out-6.txt; echo "--- brute.py output:"; cat b-out-6.txt; } > stress-6.txt
          ;;
  esac
  cat stress-6.txt
timeout: 10m
max_retries: 0
