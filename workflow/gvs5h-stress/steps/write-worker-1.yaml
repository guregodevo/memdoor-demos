type: command
requires:
  - table_pattern: worker-1
command: |
  cat > worker-reply-1.raw <<'MEMDOOR_WRK_EOF'
  {{ output "worker-1" }}
  MEMDOOR_WRK_EOF
  if grep -qsxE "done|stopped" status-*.txt 2>/dev/null; then echo "a manager already said done or stopped the loop: the ledger is kept as it is"; exit 0; fi
  awk '/^```python/{f=1;next} /^```[ ]*$/{if(f)exit} f' worker-reply-1.raw > sol-new-1.py; if [ -s sol-new-1.py ]; then mv sol-new-1.py solution.py; else rm -f sol-new-1.py; echo "no code in the reply: solution.py kept"; fi
  awk '/^### NOTES/{f=1;next} /^### /{f=0} f' worker-reply-1.raw > notes-new-1.md; if [ -s notes-new-1.md ]; then mv notes-new-1.md notes.md; else rm -f notes-new-1.md; fi
  awk '/^### NEXT/{f=1;next} /^### /{f=0} f' worker-reply-1.raw > nexts-1.txt
  sed -n '/^### STATUS/,$p' worker-reply-1.raw | tail -n +2 > wstatus-1.txt
  awk '/^### BRUTE/{f=1;next} /^### /{f=0} f' worker-reply-1.raw | awk '/^```python/{f=1;next} /^```[ ]*$/{if(f)exit} f' > brute-new-1.py; if [ -s brute-new-1.py ]; then mv brute-new-1.py brute.py; echo "brute.py rewritten by the worker"; else rm -f brute-new-1.py; fi
  printf '%s\n' '--- solution.py, current, in full ---'; cat solution.py 2>/dev/null; printf '\n%s\n' '--- notes.md, current, in full ---'; cat notes.md 2>/dev/null; printf '\n%s\n' '--- the worker: next steps ---'; cat nexts-1.txt 2>/dev/null; printf '%s\n' '--- the worker: status ---'; cat wstatus-1.txt 2>/dev/null
