type: command
when: grep -qs "PASSED" samples-1.txt && ! grep -qsxE "done|stopped" status-*.txt  # only after the public samples passed, and only while the loop is live
requires:
  - table_pattern: samples-1
  - table_pattern: write-brute
  - table_pattern: write-gen
command: |
  rm -f stress-1.txt stress-in-1.txt s-out-1.txt b-out-1.txt
  verdict=ok
  for i in $(seq 1 200); do
      if ! python3 gen.py > stress-in-1.txt 2>/dev/null; then
          verdict=genfail; break
      fi
      perl -e 'alarm shift; exec @ARGV or exit 127' 2 python3 solution.py < stress-in-1.txt > s-out-1.txt 2>/dev/null; s=$?
      perl -e 'alarm shift; exec @ARGV or exit 127' 2 python3 brute.py < stress-in-1.txt > b-out-1.txt 2>/dev/null; b=$?
      if [ "$s" -ne 0 ] || [ "$b" -ne 0 ]; then
          verdict=crash; break
      fi
      if ! diff -q s-out-1.txt b-out-1.txt >/dev/null 2>&1; then
          verdict=mismatch; break
      fi
  done
  case "$verdict" in
      ok)
          { echo "[STRESS: ok -- solution.py matched brute.py on 200 small random inputs.]"; } > stress-1.txt
          ;;
      genfail)
          { echo "[STRESS: FAILED -- gen.py exited unsuccessfully or produced invalid input on iteration $i.]"; cat stress-in-1.txt 2>/dev/null; } > stress-1.txt
          ;;
      crash)
          { echo "[STRESS: FAILED -- solution.py or brute.py timed out (2 s) or crashed on iteration $i. INPUT:]"; cat stress-in-1.txt; echo "--- solution.py:"; cat s-out-1.txt; echo "--- brute.py:"; cat b-out-1.txt; } > stress-1.txt
          ;;
      mismatch)
          { echo "[STRESS: FAILED -- outputs differ on iteration $i. THIS IS A FAILING TEST; fix the bug it exposes. INPUT:]"; cat stress-in-1.txt; echo "--- solution.py output:"; cat s-out-1.txt; echo "--- brute.py output:"; cat b-out-1.txt; } > stress-1.txt
          ;;
  esac
  cat stress-1.txt
timeout: 10m
max_retries: 0
