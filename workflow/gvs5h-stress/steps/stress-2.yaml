type: command
when: grep -qs "PASSED" samples-2.txt && ! grep -qsxE "done|stopped" status-*.txt  # only after the public samples passed, and only while the loop is live
requires:
  - table_pattern: samples-2
  - table_pattern: write-brute
  - table_pattern: write-gen
command: |
  rm -f stress-2.txt stress-in-2.txt s-out-2.txt b-out-2.txt s-err-2.txt b-err-2.txt
  verdict=ok
  for i in $(seq 1 200); do
      if ! python3 gen.py > stress-in-2.txt 2>/dev/null; then
          verdict=genfail; break
      fi
      perl -e 'alarm shift; exec @ARGV or exit 127' 2 bash .memdoor/workflows/gvs5h/run.sh solution.py < stress-in-2.txt > s-out-2.txt 2> s-err-2.txt; s=$?
      perl -e 'alarm shift; exec @ARGV or exit 127' 2 bash .memdoor/workflows/gvs5h/run.sh brute.py < stress-in-2.txt > b-out-2.txt 2> b-err-2.txt; b=$?
      if [ "$s" -ne 0 ]; then
          verdict=crash; break
      fi
      if [ "$b" -ne 0 ]; then
          verdict=brutefail; break
      fi
      if ! diff -q s-out-2.txt b-out-2.txt >/dev/null 2>&1; then
          verdict=mismatch; break
      fi
  done
  case "$verdict" in
      ok)
          { echo "[STRESS: ok -- solution.py matched brute.py on 200 small random inputs.]"; } > stress-2.txt
          ;;
      genfail)
          { echo "[STRESS: FAILED -- gen.py exited unsuccessfully or produced invalid input on iteration $i.]"; cat stress-in-2.txt 2>/dev/null; } > stress-2.txt
          ;;
      crash)
          { echo "[STRESS: FAILED -- solution.py timed out (2 s) or crashed on iteration $i. THIS IS A FAILING TEST. INPUT:]"; cat stress-in-2.txt; echo "--- solution.py stdout:"; cat s-out-2.txt; echo "--- solution.py stderr:"; tail -5 s-err-2.txt; } > stress-2.txt
          ;;
      brutefail)
          { echo "[STRESS: INCONCLUSIVE -- brute.py, the reference, crashed or timed out (2 s) on iteration $i; this says nothing about solution.py. The worker must REWRITE brute.py (section ### BRUTE): the slowest obviously correct method, small inputs only, same input contract. INPUT:]"; cat stress-in-2.txt; echo "--- brute.py stderr:"; tail -5 b-err-2.txt; } > stress-2.txt
          ;;
      mismatch)
          { echo "[STRESS: FAILED -- outputs differ on iteration $i. THIS IS A FAILING TEST; fix the bug it exposes. INPUT:]"; cat stress-in-2.txt; echo "--- solution.py output:"; cat s-out-2.txt; echo "--- brute.py output:"; cat b-out-2.txt; } > stress-2.txt
          ;;
  esac
  cat stress-2.txt
timeout: 10m
max_retries: 0
