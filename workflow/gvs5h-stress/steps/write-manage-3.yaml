type: command
when: '! grep -qsxE "done|stopped" status-*.txt'  # a round after the manager finished or stopped the loop runs nothing
requires:
  - table_pattern: manage-3
command: |
  cat > manage-reply-3.md <<'MEMDOOR_MGMT_EOF'
  {{ output "manage-3" }}
  MEMDOOR_MGMT_EOF
  if ls status-*.txt 2>/dev/null | grep -v "^status-3.txt$" | xargs grep -qsxE "done|stopped" 2>/dev/null; then (ls status-*.txt | grep -v "^status-3.txt$" | xargs grep -hsxE "done|stopped" | head -1) > status-3.txt; : > next-3.txt; echo "an earlier manager said done: this round passes the ledger on"; exit 0; fi
  status=$(awk '/^### STATUS/{f=1;next} /^### /{f=0} f' manage-reply-3.md | tr -d '[:space:]')  # to the next header or the end: a reply that stops at STATUS done has no header after it
  next=$(awk '/^### NEXT/{f=1;next} /^### /{f=0} f' manage-reply-3.md)
  printf '%s\n' "$status" > status-3.txt
  printf '%s\n' "$next" > next-3.txt
  if [ "$status" != done ] && [ -s next-3.txt ] && [ -s next-2.txt ] && [ "$(tr -d '[:space:]' < next-3.txt | tr A-Z a-z)" = "$(tr -d '[:space:]' < next-2.txt | tr A-Z a-z)" ]; then echo stopped > status-3.txt; echo "the manager reissued the same task: no progress, the loop stops here (max retries)"; fi
  sed -n '/^### TASKS/,$p' manage-reply-3.md | tail -n +2 > tasks.json
  cat manage-reply-3.md status-3.txt next-3.txt
